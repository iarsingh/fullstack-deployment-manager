apiVersion: apps/v1
kind: Deployment
metadata:
  name: fullstack-deployment-manager
  labels:
    app: fullstack-deployment-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fullstack-deployment-manager
  template:
    metadata:
      labels:
        app: fullstack-deployment-manager
    spec:
      containers:
        - name: api
          image: fullstack-deployment-manager:local
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: fullstack-deployment-manager
spec:
  selector:
    app: fullstack-deployment-manager
  ports:
    - port: 80
      targetPort: 8080
